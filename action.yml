name: 'aws-waf-temp-access'
description: 'Add GitHub Runner IP to AWS WAF IPSet and/or Security Group with automatic cleanup'
author: 'digglife'

# GitHub Marketplace metadata
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  id:
    description: 'The ID of the WAF IPSet. Required if not using security-group-id.'
    required: false
  name:
    description: 'The name of the WAF IPSet. Required if not using security-group-id.'
    required: false
  scope:
    description: 'The scope of the WAF IPSet (CLOUDFRONT or REGIONAL)'
    required: false
    default: 'REGIONAL'
  region:
    description: 'The AWS region. Falls back to AWS_REGION env, AWS_DEFAULT_REGION env, then us-east-1.'
    required: false
  security-group-id:
    description: 'The ID of the EC2 Security Group. Required if not using id/name.'
    required: false
  security-group-description:
    description: 'Description for the Security Group ingress rule'
    required: false
    default: 'Temporary access from GitHub Actions runner'
  security-group-port:
    description: 'The TCP port for the Security Group ingress rule'
    required: false
    default: '443'
  security-group-protocol:
    description: 'The IP protocol for the Security Group ingress rule'
    required: false
    default: 'tcp'

runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/cleanup.js'

outputs:
  ip-address:
    description: 'The public IP address that was added to the target(s)'
  status:
    description: 'Status of the operation (success or failed)'
